.field:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#fff03 0 1px,transparent 1px 4px),radial-gradient(ellipse at 50% 43%,transparent 0 56%,#971843 56.5% 57%,transparent 57.5%)}.field:after{content:"";position:absolute;left:20%;right:20%;bottom:-7%;height:29%;border:2px solid #961940;box-shadow:0 -1px #961940}
.top{position:absolute;z-index:4;left:5%;right:4%;top:2.1%;display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:2.65cqh;text-shadow:0 2px 2px #000}.mode{background:#020204;border-radius:999px;padding:.45% 4%;color:#fb245d;font-size:2.45cqh}.side-stack{position:absolute;z-index:3;top:10.5%;left:33%;display:grid;gap:3.2%;width:33%}.iconbox{width:100%;aspect-ratio:1;border:0;border-radius:15%;background:#f7f7fb;box-shadow:0 4px 10px #0008;display:grid;place-items:center;padding:0}.iconbox img{width:100%;height:100%;object-fit:cover;border-radius:15%}.crest{font-size:2.45cqh;line-height:.85;color:#85889b;font-weight:1000;text-align:center}.shirt{font-size:7.3cqh;color:#0aafe7;cursor:pointer}.back{position:absolute;z-index:4;left:12%;bottom:4.5%;width:85%;height:9%;border:0;border-radius:5px;background:linear-gradient(90deg,#039ee8,#06d8e0);color:#fff;font-size:2.65cqh;font-weight:bold}

.shade{position:absolute;z-index:20;inset:0;background:#0009;display:none}.shade.show{display:block}.bench{position:absolute;z-index:25;top:0;bottom:0;left:0;width:15.5%;background:#fff;color:#111;transform:translateX(-105%);transition:transform .18s;box-shadow:6px 0 18px #0008;padding:1.5% .8%;overflow:auto}.bench.open{transform:translateX(0)}.bench h2{font-size:2.15cqh;margin:0 0 3%;white-space:nowrap}.bench-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:3.5%}.bench-card{padding:0;border:0;background:transparent;position:relative}.bench-card img{width:100%;display:block;border-radius:7px}.bench-card.chosen:after{content:"✓";position:absolute;right:-7%;top:-6%;width:28%;aspect-ratio:1;border-radius:50%;background:#00bfe8;color:#fff;font-weight:bold;display:grid;place-items:center}.bench-help{font-size:1.5cqh;color:#666;margin:.5% 0 5%}.panel{position:absolute;z-index:27;left:32.5%;top:16%;width:43%;height:72%;border-radius:3px;background:#fff;color:#111;display:none;overflow:hidden;box-shadow:0 8px 22px #0008}.panel.open{display:flex;flex-direction:column}.panel-head{height:11%;display:flex;align-items:center;justify-content:space-between;padding:0 4%;border-bottom:1px solid #ddd;color:#00a7d6;font-size:1.8cqh;font-weight:bold}.panel-head button{border:0;background:transparent;color:#00a7d6;font-size:1.8cqh}.player-grid{padding:3%;display:grid;grid-template-columns:repeat(6,1fr);gap:2%;overflow:auto}.select-card{border:0;background:transparent;padding:0}.select-card img{width:100%;display:block;border-radius:7px}.close{position:absolute;right:2%;top:1%;border:0;border-radius:50%;background:#eee;width:7%;aspect-ratio:1;font-size:2cqh}

const points=[[34,10],[57,11],[41,34],[61,34],[76,34],[36,53],[56,53],[29,73],[46,73],[64,73],[48,87]];
const field=document.querySelector('#field'),benchEl=document.querySelector('#bench'),panel=document.querySelector('#panel'),shade=document.querySelector('#shade');let eleven=roster.slice(0,11).map((p,i)=>({...p,spot:i})),subs=roster.slice(11),target=null,drag=null,moved=false;
function paint(){field.querySelectorAll('.card').forEach(x=>x.remove());eleven.forEach((p,i)=>{const b=document.createElement('button');b.className='card';b.dataset.i=i;b.style.left=points[p.spot][0]+'%';b.style.top=points[p.spot][1]+'%';b.innerHTML='<img src="'+p.src+'" alt="選手">';b.onpointerdown=start;b.onclick=cardTap;field.appendChild(b)});document.querySelector('#power').textContent=3240+subs.length*2}
function start(e){drag={i:+e.currentTarget.dataset.i,x:e.clientX,y:e.clientY,el:e.currentTarget};moved=false;e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.onpointermove=move;e.currentTarget.onpointerup=drop}
function move(e){if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)moved=true;drag.el.classList.add('drag');drag.el.style.transform='translate('+dx+'px,'+dy+'px) scale(1.12)'}
function drop(e){if(!drag)return;const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card');if(moved&&hit&&+hit.dataset.i!==drag.i){const j=+hit.dataset.i,t=eleven[drag.i].spot;eleven[drag.i].spot=eleven[j].spot;eleven[j].spot=t}drag=null;paint()}
function cardTap(e){if(moved){moved=false;return}const i=+e.currentTarget.dataset.i;if(target){const out=eleven[i];eleven[i]={...target,spot:out.spot};subs=subs.map(x=>x.id===target.id?{...out}:x);target=null;closeAll();paint();return}openPanel(i)}
function openBench(){target=null;document.querySelector('#benchHelp').textContent='スタメンと入れ替える選手を選択';const grid=document.querySelector('#benchGrid');grid.innerHTML='';subs.forEach(p=>{const b=document.createElement('button');b.className='bench-card';b.innerHTML='<img src="'+p.src+'" alt="控え">';b.onclick=()=>{target=p;document.querySelectorAll('.bench-card').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen');document.querySelector('#benchHelp').textContent='外すスタメンをタップしてください'};grid.appendChild(b)});benchEl.classList.add('open');shade.classList.add('show')}
function openPanel(i){const grid=document.querySelector('#playerGrid');grid.innerHTML='';roster.forEach(p=>{const b=document.createElement('button');b.className='select-card';b.innerHTML='<img src="'+p.src+'" alt="選手">';b.onclick=()=>{const out=eleven[i],exists=eleven.findIndex(x=>x.id===p.id);if(exists>=0){let tmp=eleven[i].spot;eleven[i].spot=eleven[exists].spot;eleven[exists].spot=tmp;[eleven[i],eleven[exists]]=[eleven[exists],eleven[i]]}else{eleven[i]={...p,spot:out.spot};subs=subs.map(x=>x.id===p.id?{...out}:x)}closeAll();paint()};grid.appendChild(b)});panel.classList.add('open');shade.classList.add('show')}
function closeAll(){benchEl.classList.remove('open');panel.classList.remove('open');shade.classList.remove('show')};document.querySelector('#shirtA').onclick=openBench;document.querySelector('#shirtB').onclick=openBench;document.querySelector('#shade').onclick=closeAll;document.querySelector('#close').onclick=closeAll;document.querySelector('#toggle').onclick=()=>{eleven.reverse();eleven.forEach((x,i)=>x.spot=i);paint()};document.querySelector('#auto').onclick=()=>{eleven.sort(()=>Math.random()-.5);eleven.forEach((x,i)=>x.spot=i);paint()};paint();
</script></main></div></body></html>
